name: Development task
description: Define a focused change and how to verify it.
body:
  - type: markdown
    attributes:
      value: |
        Use English and keep this task focused on one outcome. Do not include credentials or private memory data.
        Small, clear changes may be described directly in a pull request instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens today, who is affected, and why should it change? Link relevant issues or decisions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior that will make this task complete, including relevant failure cases.
      placeholder: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Identify affected components, exclusions, compatibility needs, and unresolved decisions. Leave blank when unnecessary.
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How will the acceptance criteria be checked? Suggest commands, tests, or manual checks; identify any unknowns.
    validations:
      required: true
