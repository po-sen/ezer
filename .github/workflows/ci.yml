name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ezer_test
          POSTGRES_DB: ezer_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U ezer_test -d ezer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: "false"
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      - name: Validate repository and applications
        run: pnpm run check
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
